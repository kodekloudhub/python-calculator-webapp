# loadtest-pipeline
# Runs the JMeter load test against the deployed calculator Web App from CI/CD using Azure Load
# Testing, and fails the build if the run breaches the failure criteria in loadtest/loadtest.yaml.
#
# Auth: the AzureCLI task uses the ARM service connection. No extra role grant is needed -- an
# identity with Contributor/Owner at the subscription level automatically has Load Test Owner
# data-plane access on load testing resources.

trigger: none

resources:
  repositories:
    - repository: self
      trigger: none

variables:
  - group: lab-vars            # resourceGroup, location, azureServiceConnection (published at startup)

pool:
  name: kk-devops-agent-pool

steps:
- task: AzureCLI@2
  displayName: Run the load test with Azure Load Testing
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e
      az extension add --name load --only-show-errors

      RG="$(resourceGroup)"
      ALT=$(az load list --resource-group "$RG" --query "[0].name" -o tsv)
      WEBAPP=$(az webapp list --resource-group "$RG" --query "[0].name" -o tsv)
      HOST=$(az webapp show --resource-group "$RG" --name "$WEBAPP" --query defaultHostName -o tsv)
      echo "Load Testing resource: $ALT | target host: $HOST"

      cd loadtest
      sed -i "s/REPLACE_WITH_WEBAPP_HOST/$HOST/" loadtest.yaml

      RUN_ID="ci-run-$(Build.BuildId)"
      az load test create \
        --load-test-resource "$ALT" --resource-group "$RG" \
        --test-id calculator-ci-test \
        --load-test-config-file loadtest.yaml
      # create returns at execution-end; don't let a non-zero (e.g. criteria) exit abort the poll.
      az load test-run create \
        --load-test-resource "$ALT" --resource-group "$RG" \
        --test-id calculator-ci-test --test-run-id "$RUN_ID" || true

      # testResult stays NOT_APPLICABLE for a few minutes while Azure aggregates client metrics;
      # poll until it reaches a terminal state before gating the build.
      STATUS="NOT_APPLICABLE"
      for i in $(seq 1 20); do
        STATUS=$(az load test-run show \
          --load-test-resource "$ALT" --resource-group "$RG" \
          --test-run-id "$RUN_ID" --query "testResult" -o tsv 2>/dev/null)
        echo "Attempt $i: testResult=$STATUS"
        if [ "$STATUS" = "PASSED" ] || [ "$STATUS" = "FAILED" ]; then break; fi
        sleep 15
      done

      echo "Final load test result: $STATUS"
      if [ "$STATUS" != "PASSED" ]; then
        echo "##vso[task.logissue type=error]Load test result: $STATUS (criteria not met, or did not finalize in time)"
        exit 1
      fi
