#NAME THE PIPELINE SAME AS FILE (WITHOUT ".yml")

resources:
  repositories:
    - repository: self
      trigger: none

variables:
  - group: lab-vars            # azureServiceConnection + resourceGroup + location + subscriptionId (detected at startup)

stages:
- stage: Deploy
  jobs:
  - job: Deploy
    pool:
      name: kk-devops-agent-pool
    steps:
    - task: AzureCLI@2
      displayName: Enable the ACR admin user (so the Web App can pull the image)
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          ACR=$(az acr list --resource-group "$(resourceGroup)" --query "[0].name" -o tsv)
          echo "Enabling admin user on $ACR"
          az acr update --name "$ACR" --admin-enabled true
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy Web App for Containers using Bicep
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroup)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'infra/webapp-docker.bicep'
        deploymentMode: 'Incremental'
