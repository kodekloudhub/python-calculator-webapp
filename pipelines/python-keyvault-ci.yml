# python-keyvault-ci
# Demonstrates consuming an Azure Key Vault secret in a pipeline through a Key Vault-linked
# variable group. The secret value is mapped into an environment variable and used WITHOUT
# being printed to the logs (Azure Pipelines masks secret values automatically).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/*

resources:
  repositories:
    - repository: self
      trigger: none

variables:
  # 'kv-variable-group' is linked to your Azure Key Vault in Pipelines > Library.
  # It exposes the 'DatabasePassword' secret as a pipeline variable.
  - group: kv-variable-group

pool:
  name: kk-devops-agent-pool

steps:
- script: |
    sudo apt-get update
    sudo apt-get install -y python3 python3-pip python3-venv
  displayName: Install Python3, pip, venv

- script: |
    python3 -m venv venv
    source venv/bin/activate
    pip install --upgrade pip
    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    pytest tests/test_calc.py
  displayName: Restore dependencies and run tests

- script: |
    if [ -z "$SECRET" ]; then
      echo "ERROR: secret 'DatabasePassword' was not retrieved from Key Vault." >&2
      exit 1
    fi
    echo "Secret retrieved successfully from Key Vault (length: ${#SECRET} characters)."
    echo "The value itself is masked in the logs."
  displayName: Verify the Key Vault secret is available
  env:
    # Map the secret variable into an environment variable so the script can read it.
    SECRET: $(DatabasePassword)
